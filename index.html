<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skyline Coaster Studio</title>
<style>
:root{
  --bg:#0b1322;--panel:rgba(12,20,38,.9);--panel2:rgba(28,42,72,.92);--line:rgba(255,255,255,.09);
  --text:#e9eff9;--muted:#8fa0bf;--accent:#ff6b3d;--accent2:#2ad1c4;--warn:#ffc547;--bad:#ff4d6a;--good:#4ee38a;--silly:#ff4fd8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;color:var(--text);user-select:none;-webkit-user-select:none}
#viewport{position:fixed;inset:0}
#viewport canvas{display:block;outline:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,10,.38) 100%)}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;transition:background .12s,border-color .12s,transform .08s;white-space:nowrap}
button:hover{background:#2b4070;border-color:rgba(255,255,255,.22)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:linear-gradient(135deg,#ff8247,#ff4d6a);border:none;font-weight:650;color:#fff}
button.primary:hover{filter:brightness(1.1)}
button.teal{background:linear-gradient(135deg,#2ad1c4,#2a8fd1);border:none;font-weight:650;color:#04121c}
button.active{background:var(--accent2);color:#03161a;border-color:transparent;font-weight:600}
button.ghost{background:transparent}
button.danger{background:rgba(255,77,106,.18);border-color:rgba(255,77,106,.4)}
input,select,textarea{font:inherit;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:5px 7px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)}
textarea{resize:vertical;width:100%;min-height:60px;user-select:text}
input[type=text]{user-select:text}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;padding:0;background:rgba(255,255,255,.15);border:none;border-radius:3px;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent2);cursor:pointer;border:2px solid #0b1322}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent2);cursor:pointer;border:2px solid #0b1322}
input[type=checkbox]{accent-color:var(--accent2);width:15px;height:15px;margin:0}
input[type=color]{padding:0;width:34px;height:24px;border:none;background:none;cursor:pointer}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.03em;background:rgba(255,255,255,.12)}
.tag.silly{background:linear-gradient(90deg,#ff4fd8,#ffb14f,#4fffb0,#4fb7ff);color:#1a0820}
.tag.normal{background:rgba(42,209,196,.22);color:#9ff5ec}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}

/* ---------- main menu ---------- */
#menu{position:fixed;inset:0;display:flex;align-items:center;background:linear-gradient(90deg,rgba(5,10,22,.92) 0%,rgba(5,10,22,.6) 38%,rgba(5,10,22,0) 70%)}
.menu-inner{margin-left:7vw;width:380px;max-width:86vw}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.logo svg{width:84px;height:84px;filter:drop-shadow(0 4px 14px rgba(255,107,61,.45))}
.logo h1{margin:0;font-size:46px;letter-spacing:.09em;font-weight:900;line-height:1;background:linear-gradient(135deg,#fff 0%,#ffd2b8 45%,#ff6b3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .sub{font-size:13px;letter-spacing:.42em;color:var(--accent2);font-weight:700;margin-top:6px}
.menu-buttons{display:flex;flex-direction:column;gap:10px}
.menu-buttons button{font-size:17px;padding:13px 20px;text-align:left;border-radius:12px;background:rgba(18,30,56,.78);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px}
.menu-buttons button .ico{width:26px;text-align:center;font-size:18px}
.menu-buttons button:hover{background:rgba(42,64,112,.9);transform:translateX(4px)}
.menu-buttons button.primary{background:linear-gradient(135deg,#ff8247,#ff4d6a)}
.menu-foot{margin-top:26px;color:var(--muted);font-size:12px}
#sillyBadge{position:fixed;top:14px;right:16px;z-index:30}

/* ---------- editor ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:10;backdrop-filter:blur(8px)}
#topbar .brand{font-weight:900;letter-spacing:.12em;color:#ffd2b8;margin-right:6px;font-size:15px;display:flex;align-items:center;gap:6px}
#topbar .brand svg{width:26px;height:26px}
#topbar input.name{width:190px;font-weight:600}
#topbar .sep{width:1px;height:26px;background:var(--line);margin:0 2px}
#toolbar{position:fixed;top:60px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:10}
#toolbar button{width:46px;height:46px;padding:0;font-size:19px;border-radius:12px;background:var(--panel);position:relative}
#toolbar button.active{background:var(--accent2)}
#toolbar button .k{position:absolute;right:3px;bottom:1px;font-size:9px;opacity:.6}
#toolbar .tsep{height:6px}
#panel{position:fixed;top:58px;right:10px;width:300px;bottom:60px;background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:10;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(8px)}
#panelTabs{display:flex;flex-wrap:wrap;gap:3px;padding:7px;border-bottom:1px solid var(--line)}
#panelTabs button{padding:4px 8px;font-size:12px;border-radius:6px;flex:1}
#panelBody{flex:1;overflow-y:auto;padding:10px 12px 16px}
#panelBody::-webkit-scrollbar{width:7px}#panelBody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.sec{margin-bottom:14px}
.sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.field{display:flex;align-items:center;gap:8px;margin:7px 0}
.field label{width:96px;flex-shrink:0;color:#c5d1e6;font-size:12px}
.field .val{width:62px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid2 button,.grid3 button{padding:7px 4px;font-size:12px}
.hint{font-size:11.5px;color:var(--muted);margin:6px 0}
.piece-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
#bottombar{position:fixed;left:68px;right:320px;bottom:10px;min-height:42px;background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:10;display:flex;align-items:center;gap:14px;padding:6px 14px;font-size:12.5px;backdrop-filter:blur(8px);flex-wrap:wrap}
#bottombar .stat b{color:#fff;font-variant-numeric:tabular-nums}
#bottombar .stars{color:#ffc547;letter-spacing:1px}
#bottombar .warnings{color:var(--warn);flex:1;min-width:120px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#challengeBox{position:fixed;left:68px;top:60px;width:260px;background:var(--panel);border:1px solid rgba(255,197,71,.4);border-radius:12px;padding:10px 12px;z-index:9;font-size:12.5px}
#challengeBox h4{margin:0 0 6px;color:var(--warn)}
#challengeBox .goal{display:flex;gap:6px;margin:3px 0}
#challengeBox .goal.ok{color:var(--good)}
#cursorInfo{position:fixed;pointer-events:none;z-index:12;background:rgba(0,0,0,.65);padding:3px 7px;border-radius:5px;font-size:11.5px;transform:translate(14px,14px)}

/* ---------- ride HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .box{position:absolute;background:rgba(6,12,26,.72);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);padding:10px 14px}
#hudSpeed{left:16px;bottom:16px;min-width:210px;pointer-events:auto;cursor:pointer}
#hudSpeed .big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#hudSpeed .unit{font-size:16px;color:var(--muted);margin-left:4px}
#hudSpeed .sub{color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
#hudG{right:16px;top:16px;width:300px}
#hudG .gs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;text-align:center}
#hudG .gs div{background:rgba(255,255,255,.05);border-radius:8px;padding:4px}
#hudG .gs b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
#hudG .gs small{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
#gGraph{width:272px;height:96px;display:block}
#hudTop{left:50%;top:16px;transform:translateX(-50%);text-align:center;min-width:260px}
#hudTop .seg{font-weight:700;letter-spacing:.06em}
#hudWarn{position:absolute;left:50%;top:86px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#hudWarn div{background:rgba(255,77,106,.88);color:#fff;font-weight:700;padding:7px 14px;border-radius:10px;animation:pop .25s ease-out}
#hudWarn div.silly{background:linear-gradient(90deg,#ff4fd8,#8a4fff);}
#hudWarn div.info{background:rgba(42,209,196,.9);color:#03161a}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#hudCtl{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;pointer-events:auto}
#hudCtl .muted{font-size:11.5px}

/* ---------- modal ---------- */
#modalWrap{position:fixed;inset:0;background:rgba(2,6,14,.62);z-index:40;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal{background:linear-gradient(180deg,#14213d,#0e182d);border:1px solid rgba(255,255,255,.12);border-radius:18px;width:min(720px,94vw);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .18s ease-out}
#modal.wide{width:min(1100px,96vw);height:88vh}
#modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
#modal .mh h2{margin:0;font-size:19px;flex:1}
#modal .mb{padding:16px 18px;overflow-y:auto;flex:1}
#modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.12s;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent2);transform:translateY(-2px)}
.card .thumb{aspect-ratio:16/9;background:#1a2a48 center/cover;position:relative}
.card .thumb .tag{position:absolute;top:7px;left:7px}
.card .cb{padding:8px 10px}
.card .cb .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cb .a{color:var(--muted);font-size:12px}
.card .cb .m{display:flex;gap:8px;margin-top:5px;font-size:11.5px;color:#c7d3ea;flex-wrap:wrap}
.stars{color:#ffc547}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.statgrid div{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px}
.statgrid small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.statgrid b{font-size:18px;font-variant-numeric:tabular-nums}
.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.ratings div{border-radius:12px;padding:10px;text-align:center;background:rgba(255,255,255,.06)}
.ratings b{display:block;font-size:30px;font-weight:800}
.ratings small{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.1em}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%}
.warnlist div{padding:6px 10px;border-radius:8px;margin:4px 0;background:rgba(255,197,71,.12);color:#ffe2a0}
.warnlist div.silly{background:rgba(255,79,216,.14);color:#ffc2f2}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.comment{background:rgba(255,255,255,.04);border-radius:8px;padding:7px 10px;margin:6px 0}
.comment b{color:var(--accent2)}
.starpick span{font-size:26px;cursor:pointer;color:#56627a;transition:.1s}
.starpick span.on{color:#ffc547}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
kbd{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:600 11.5px ui-monospace,Menlo,monospace;color:#fff;margin-right:2px}
.list-item{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:8px}
.list-item img{width:128px;height:72px;object-fit:cover;border-radius:7px;background:#1a2a48}
.chal{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:8px;border:1px solid var(--line)}
.chal .done{color:var(--good);font-weight:700}
#toasts{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none}
#toasts div{background:rgba(10,18,34,.95);border:1px solid var(--line);padding:8px 16px;border-radius:10px;animation:pop .2s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toasts div.good{border-color:var(--good)}#toasts div.bad{border-color:var(--bad)}#toasts div.silly{border-color:var(--silly)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1322;z-index:100;font-size:18px;letter-spacing:.2em;color:var(--accent2)}
#fps{position:fixed;left:70px;bottom:60px;z-index:11;font:11px monospace;color:#9f9}
@media (max-width:900px){#panel{width:250px}#bottombar{right:270px}}
</style>
</head>
<body>
<div id="viewport"></div>
<div id="vignette"></div>
<div id="loading">LOADING SKYLINE…</div>

<div id="menu" class="hidden">
  <div class="menu-inner">
    <div class="logo">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffd2b8"/><stop offset="1" stop-color="#ff4d6a"/></linearGradient></defs>
        <path d="M6 82 C 26 82, 30 20, 50 20 C 70 20, 74 60, 62 64 C 50 68, 44 46, 58 40 C 72 34, 82 70, 96 82" fill="none" stroke="url(#lg)" stroke-width="8" stroke-linecap="round"/>
        <path d="M6 92 H96" stroke="#2ad1c4" stroke-width="4" stroke-linecap="round"/></svg>
      <div><h1>SKYLINE</h1><div class="sub">COASTER STUDIO</div></div>
    </div>
    <div class="menu-buttons">
      <button class="primary" data-act="new"><span class="ico">✚</span>New Coaster</button>
      <button data-act="continue" id="btnContinue"><span class="ico">⟲</span>Continue Last Design</button>
      <button data-act="load"><span class="ico">📂</span>Load</button>
      <button data-act="community"><span class="ico">🌐</span>Community</button>
      <button data-act="challenges"><span class="ico">🏆</span>Challenges</button>
      <button data-act="settings"><span class="ico">⚙</span>Settings</button>
    </div>
    <div class="menu-foot">Design · Test · Share — build the ride of your dreams.<br><span id="menuSilly"></span></div>
  </div>
</div>

<div id="editor" class="hidden">
  <div id="topbar">
    <div class="brand"><svg viewBox="0 0 100 100"><path d="M6 82 C 26 82, 30 20, 50 20 C 70 20, 74 60, 62 64 C 50 68, 44 46, 58 40 C 72 34, 82 70, 96 82" fill="none" stroke="#ff6b3d" stroke-width="10" stroke-linecap="round"/></svg>SKYLINE</div>
    <button id="btnMenu" title="Main menu">☰ Menu</button>
    <input class="name" id="coasterName" type="text" maxlength="40" placeholder="Coaster name">
    <div class="sep"></div>
    <button id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
    <button id="btnCopy" title="Copy selected nodes (Ctrl+C)">⧉ Copy</button>
    <button id="btnPaste" title="Paste after selected node (Ctrl+V)">📋 Paste</button>
    <button id="btnMirror" title="Mirror selection / whole track (M)">⇋ Mirror</button>
    <button id="btnSnap" title="Grid snapping (G)">▦ Snap</button>
    <button id="btnHeat" title="G-force heatmap (H)">🌡 Heatmap</button>
    <div class="grow"></div>
    <span id="sillyTop"></span>
    <button id="btnSave" title="Save (Ctrl+S)">💾 Save</button>
    <button id="btnPublish" title="Publish to the community board">🌐 Publish</button>
    <button id="btnSettings" title="Settings">⚙</button>
    <button id="btnTest" class="primary" title="Test ride (T)">▶ Test Ride</button>
  </div>
  <div id="toolbar"></div>
  <div id="panel"><div id="panelTabs"></div><div id="panelBody"></div></div>
  <div id="bottombar"></div>
  <div id="challengeBox" class="hidden"></div>
</div>
<div id="cursorInfo" class="hidden"></div>

<div id="hud" class="hidden">
  <div class="box" id="hudTop"><div class="seg" id="hudSeg">STATION</div><div class="muted" id="hudTime">0:00</div></div>
  <div id="hudWarn"></div>
  <div class="box" id="hudSpeed" title="Click to toggle mph / km/h"><div><span class="big" id="hudV">0</span><span class="unit" id="hudVU">mph</span></div><div class="sub" id="hudH">Height 0 ft</div></div>
  <div class="box" id="hudG">
    <div class="gs"><div><small>Vertical</small><b id="gV">1.0</b></div><div><small>Lateral</small><b id="gL">0.0</b></div><div><small>Longit.</small><b id="gF">0.0</b></div></div>
    <canvas id="gGraph" width="544" height="192"></canvas>
    <div class="row muted" style="font-size:11px;margin-top:4px;gap:12px"><span style="color:#5fb7ff">■ vertical</span><span style="color:#ffa64d">■ lateral</span><span style="color:#5fe39a">■ longitudinal</span></div>
  </div>
  <div class="box" id="hudCtl">
    <button id="btnCam">🎥 Camera: Ride</button>
    <button id="btnSlow">⏱ 1×</button>
    <button id="btnRestart">⟲ Restart</button>
    <button id="btnStop" class="primary">■ Stop (Esc)</button>
  </div>
</div>

<div id="modalWrap" class="hidden"><div id="modal"></div></div>
<div id="toasts"></div>
<div id="fps" class="hidden"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   SKYLINE COASTER STUDIO
   A roller coaster design / test / share sandbox. Single file, Three.js r128.

   Architecture (top to bottom):
     Core utils, Store, Settings, Units, UI helpers
     Sound           – Web Audio synthesis (wind, rumble, chain, screams)
     Terrain         – heightmap + water, brushes, ray-marching picker
     Env             – sky dome, sun/moon, day/night cycle, weather
     Scenery         – instanced procedural props
     Track           – spline (per-node Hermite) -> arc-length samples -> frames
     PathBuilder     – element templates (loops, rolls, helixes...) as plain nodes
     TrackRenderer   – rails / ties / piece fins / station / supports / lights
     Train           – car meshes
     Sim             – substepped energy-based train integrator + telemetry
     Ratings         – excitement / intensity / nausea / stars
     Challenges
     Community       – backend interface + LocalStorage implementation + UI
     Editor          – tools, selection, undo/redo, copy/paste, mirror
     Ride            – live test mode, HUD, cameras
     App             – screens, main loop
   ===================================================================== */

const $ = s => document.querySelector(s);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = t => t * t * (3 - 2 * t);
const G0 = 9.81, MPH = 2.236936, KMH = 3.6, FT = 3.28084;
const DS = 0.5;                       // physics sample spacing along the track (m)
const V3 = THREE.Vector3;
const UPV = new V3(0, 1, 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const wrapDeg = d => { d = ((d + 180) % 360 + 360) % 360 - 180; return d === -180 ? 180 : d; };
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function timeAgo(t) { const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
function fmtTime(s) { s = Math.max(0, s); const m = Math.floor(s / 60); return m + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }

  lon: ['Faces have been temporarily relocated.', 'The riders can now see last Tuesday.', 'Eyeballs are now in the back row.'],
  speed: ['NASA would like a word.', 'The train just broke the sound barrier. And the window barrier.', 'Speed limit? Never heard of her.', 'The train is technically a satellite.'],

/* =====================================================================
   RATINGS
   ===================================================================== */
const Ratings = {
  rate(st, silly) {
    const mph = st.maxSpeed * MPH;
    let I = Math.min(3.5, mph / 28) + Math.max(0, st.maxVG - 2) * 0.85 + Math.max(0, 0.4 - st.minVG) * 1.3 + st.maxLat * 1.3 +
      Math.max(0, st.maxLon - 0.8) * 0.5 + st.inversions * 0.35 + Math.min(1, st.airtime * 0.12);
    let N = st.maxLat * 1.3 + st.inversions * 0.42 + Math.min(2.5, st.jerk * 0.1) + Math.min(1.5, st.highLatT * 0.12) +
      Math.max(0, st.maxVG - 3.5) * 0.45 + Math.min(1.5, st.maxRollRate / 260);
    let E = 0.8 + Math.min(2.4, mph / 30) + Math.min(2.2, st.airtime * 0.42) + Math.min(1.9, st.inversions * 0.45) + Math.min(1.2, st.drop / 40) +
      Math.min(0.9, st.length / 900) + Math.min(0.7, st.duration / 100) + (st.launches ? 0.5 : 0) + Math.max(0, 0.8 - st.jerk * 0.04);
    const rawI = I;
    if (silly) { E += Math.min(2.5, mph / 200) + Math.min(1, Math.max(0, st.maxVG - 6) / 40); E -= (Math.min(I, 10) - 7.5 > 0 ? (Math.min(I, 10) - 7.5) * 0.3 : 0) + Math.max(0, Math.min(N, 10) - 6) * 0.2; }
    else { if (I > 7.5) E -= (I - 7.5) * 0.8; if (N > 6) E -= (N - 6) * 0.6; }
    if (st.result !== 'complete') E *= 0.4;
    if (st.unsafe && !silly) E *= 0.55;
    E = clamp(E, 0, 10); I = clamp(I, 0, 10); N = clamp(N, 0, 10);
    const smoothness = clamp(10 - st.jerk * 0.5, 0, 10);
    let sc = E / 2 + (I >= 3 && I <= 7.5 ? 0.3 : 0) + (I < 3 && E > 4 ? 0.5 : 0) - (silly ? 0 : Math.max(0, N - 6.5) * 0.25);
    let stars = clamp(Math.round(sc * 2) / 2, 0.5, 5);
    if (st.result !== 'complete') stars = Math.min(stars, 1);
    return { excitement: +E.toFixed(2), intensity: +I.toFixed(2), nausea: +N.toFixed(2), stars, smoothness: +smoothness.toFixed(1), offCharts: rawI > 10 };
  },
  label(v) { return v < 2 ? 'Very Low' : v < 4 ? 'Low' : v < 6 ? 'Medium' : v < 8 ? 'High' : 'Very High'; },
  color(v) { return v < 4 ? '#4ee38a' : v < 6.5 ? '#ffc547' : v < 8.5 ? '#ff8a3d' : '#ff4d6a'; }
};

  { id: 'speed', name: 'Speed Demon', desc: 'Hit 70 mph using nothing but gravity.', goals: [['Top speed 70 mph (113 km/h)+', s => s.maxSpeed * MPH >= 70], ['No launch sections', s => s.launches === 0], ['Ride completes', s => s.result === 'complete']] },

/* =====================================================================
   SPEED-AWARE ELEMENT SIZING (used by the element wizard and the samples)
   ===================================================================== */
Object.assign(PathBuilder.prototype, {
  g: G0, mu: STYLES.steel.mu, drag: STYLES.steel.drag, E: 6.25,
  setStyle(style) { const st = STYLES[style] || STYLES.steel; this.mu = st.mu; this.drag = st.drag; return this; },
  vEst(y = this.p.y) { return Math.sqrt(Math.max(9, this.E - 2 * this.g * (y - this.p.y))); },
  topY() { return this.p.y + this.E / (2 * this.g); },
  setSpeed(v) { this.E = v * v; return this; },
  launchTrack(len, speed, time, type = 'launch') {
    this.setPiece(type, { speed, time }); this.straight(len); this.E = speed * speed; return this;
  },
  liftHill(height, angle = 40, speed) { this.lift(height, angle, { speed }); this.E = Math.pow(speed || 4, 2); return this; },
  // crest pushover -> straight dive -> pull-out radius chosen for a target G
  dropTo(yTarget, angle = 55, pullG = 3.3) {
    const g = this.g, dy = this.p.y - yTarget; if (dy < 2) return this;
    let a = angle * Math.PI / 180;
    const v0 = this.vEst(), vb2 = Math.max(9, this.E + 2 * g * dy * 0.95);
    const Rp = Math.max(9, v0 * v0 / (g * 0.75)), Rb = Math.max(8, vb2 / (g * (pullG - 1)));
    let straight = dy - (Rp + Rb) * (1 - Math.cos(a));
    while (straight < 0 && a > 0.2) { a *= 0.9; straight = dy - (Rp + Rb) * (1 - Math.cos(a)); }
    straight = Math.max(0, straight);
    const f = this.f, b = this.p.clone();
    let x = 0, y = 0;
    const pts = [];
    for (const t of [0.5, 1]) pts.push([Rp * Math.sin(a * t), -Rp * (1 - Math.cos(a * t))]);
    x = pts[1][0]; y = pts[1][1];
    x += straight / Math.tan(a); y -= straight; pts.push([x, y]);
    for (const t of [1 / 3, 2 / 3, 1]) { const th = a * (1 - t); pts.push([x + Rb * (Math.sin(a) - Math.sin(th)), y - Rb * (Math.cos(th) - Math.cos(a))]); }
    for (const [px, py] of pts) this.node(b.clone().addScaledVector(f, px).add(new V3(0, py, 0)));
    return this;
  },
  airHill(H, crestG = -0.1) {
    const vc2 = Math.max(16, this.E - 2 * this.g * H);
    const R = vc2 / (this.g * (1 - crestG));
    const L = clamp(Math.PI * Math.sqrt(2 * R * H), 24, 320);
    return this.hill(L, H, { k: 8 });
  },
  autoLoop(dir = 1, scale = 1) {
    const v = this.vEst(); const size = clamp(v * v / (this.g * 5.2) * scale, 6, Settings.d.silly ? 50000 : 220);
    return this.loop(size, 4 * dir, dir);
  },
  autoTurn(deg, latG = 1.5, dy = 0) {
    const v = this.vEst(this.p.y + dy / 2), R = clamp(v * v / (this.g * latG), 9, 400);
    this.turn(deg, R, dy, { auto: true });
    return this.straight(clamp(v * 0.6, 8, 60), { auto: true });   // run-out lets the bank unwind smoothly
  },
  autoHelix(turns, dir, dy = 0) {
    const v = this.vEst(this.p.y + dy / 2), R = clamp(v * v / (this.g * 1.9), 10, 300);
    this.turn(360 * turns * dir, R, dy, { auto: true, step: 36 });
    return this.straight(clamp(v * 0.6, 8, 60), { auto: true });
  },
  corkscrew(dir = 1) { const v = this.vEst(); return this.roll(Math.max(24, v * 1.6), 1.6, dir, 2.5, { k: 12 }); },
  zeroG(dir = 1) { const v = this.vEst(); return this.roll(Math.max(28, v * 2.1), 1.1, dir, 5, { k: 12 }); },
  // bring an out-and-back layout home: brake run, line up, 180° turn into the station
  home(st, brakeLen = 26) {
    // coast back alongside the station, U-turn behind it, then brake into the platform
    const target = new V3(st.x - brakeLen, st.y, st.z);
    const d = target.clone().sub(this.p).dot(this.f);
    if (d > 1) {
      const n = Math.ceil(d / 60);
      for (let i = 0; i < n; i++) {
        if (d / n > 30) this.setPiece('lift', { speed: 6 });   // booster tyres keep a slow train moving home (never slow a fast one)
        this.straight(d / n, { dy: (st.y + 1 - this.p.y) / (n - i) * 0.8 });
      }
    }
    const side = Math.sign(target.clone().sub(this.p).dot(this.n)) || 1;
    const boosted = this.nodes[this.nodes.length - 2] && this.nodes[this.nodes.length - 2].type === 'lift', i0 = this.nodes.length - 1;
    this.uturnTo(target, side, st.y - this.p.y);
    if (boosted) for (let i = i0; i < this.nodes.length - 1; i++) { this.nodes[i].type = 'lift'; this.nodes[i].speed = 6; }
    const last = this.nodes[this.nodes.length - 1]; last.auto = false; last.roll = 0;
    this.setPiece('brake', { speed: 4 });
    return this;
  }
});

/* =====================================================================
   COMMUNITY
   Backend interface (all async so a real server can be dropped in):
     list({category:'normal'|'silly', sort:'top'|'new'|'intense'|'fast', q}) -> Entry[]
     get(id) -> Entry | publish(entry) -> Entry | rate(id,user,stars) | comment(id,user,text) | remove(id,user)
   Entry: {id,name,author,description,screenshot,design,stats,ratings,silly,created,votes:{user:stars},comments:[{author,text,t}]}
   ===================================================================== */
class LocalCommunityBackend {
  constructor(key) { this.key = key; }
  _load() { return Store.get(this.key, { entries: [] }); }
  _save(db) {
    if (Store.set(this.key, db)) return true;
    // storage full: drop the oldest screenshots of other people's entries and retry
    db.entries.filter(e => e.sample).forEach(e => e.screenshot = null);
    return Store.set(this.key, db);
  }
  static avg(e) { const v = Object.values(e.votes || {}); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; }
  async list({ category = 'normal', sort = 'top', q = '' } = {}) {
    let list = this._load().entries.filter(e => (category === 'silly') === !!e.silly);
    if (q) { const s = q.toLowerCase(); list = list.filter(e => (e.name + ' ' + e.author + ' ' + e.description).toLowerCase().includes(s)); }
    const A = LocalCommunityBackend.avg;
    const score = e => { const n = Object.keys(e.votes || {}).length; return (A(e) * n + 3 * 2) / (n + 2); };   // bayesian average
    const sorters = { top: (a, b) => score(b) - score(a), new: (a, b) => b.created - a.created, intense: (a, b) => b.ratings.intensity - a.ratings.intensity || b.stats.maxVG - a.stats.maxVG, fast: (a, b) => b.stats.maxSpeed - a.stats.maxSpeed };
    return list.sort(sorters[sort] || sorters.top);
  }
  async get(id) { return this._load().entries.find(e => e.id === id) || null; }
  async publish(entry) {
    const db = this._load(); entry.id = entry.id || uid(); entry.created = Date.now(); entry.votes = entry.votes || {}; entry.comments = entry.comments || [];
    db.entries = db.entries.filter(e => e.id !== entry.id); db.entries.push(entry);
    if (!this._save(db)) throw new Error('Storage full'); return entry;
  }
  async update(id, fn) { const db = this._load(), e = db.entries.find(x => x.id === id); if (!e) return null; fn(e); this._save(db); return e; }
  async rate(id, user, stars) { return this.update(id, e => { e.votes = e.votes || {}; e.votes[user] = clamp(stars | 0, 1, 5); }); }
  async comment(id, user, text) { return this.update(id, e => e.comments.push({ author: user, text: String(text).slice(0, 400), t: Date.now() })); }
  async remove(id, user) { const db = this._load(); db.entries = db.entries.filter(e => !(e.id === id && e.author === user)); this._save(db); }
  async setScreenshot(id, url) { return this.update(id, e => e.screenshot = url); }
}
// Example of how a real server would plug in (not used: there is no backend).
class RemoteCommunityBackend {
  constructor(base) { this.base = base; }
  async _j(path, opt) { const r = await fetch(this.base + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opt)); if (!r.ok) throw new Error(r.status); return r.json(); }
  list(q) { return this._j('/coasters?' + new URLSearchParams(q)); }
  get(id) { return this._j('/coasters/' + id); }
  publish(e) { return this._j('/coasters', { method: 'POST', body: JSON.stringify(e) }); }
  rate(id, user, stars) { return this._j(`/coasters/${id}/rating`, { method: 'PUT', body: JSON.stringify({ user, stars }) }); }
  comment(id, user, text) { return this._j(`/coasters/${id}/comments`, { method: 'POST', body: JSON.stringify({ user, text }) }); }
  remove(id) { return this._j('/coasters/' + id, { method: 'DELETE' }); }
  setScreenshot(id, url) { return this._j(`/coasters/${id}/screenshot`, { method: 'PUT', body: JSON.stringify({ url }) }); }
}

/* =====================================================================
   FREE CAMERA — orbit / pan / zoom
   ===================================================================== */
const Cam = {
  target: new V3(0, 6, 0), yaw: 0.9, pitch: 0.48, dist: 190, keys: {}, goal: null,
  sens() { return Settings.d.camSens || 1; },
  fwd() { return new V3(-Math.sin(this.yaw), 0, -Math.cos(this.yaw)); },
  right() { return new V3(Math.cos(this.yaw), 0, -Math.sin(this.yaw)); },
  orbit(dx, dy) { this.goal = null; this.yaw -= dx * 0.005 * this.sens(); this.pitch = clamp(this.pitch + dy * 0.005 * this.sens() * (Settings.d.invertOrbit ? -1 : 1), 0.03, 1.53); },
  pan(dx, dy) { this.goal = null; const s = this.dist * 0.0016 * this.sens(); this.target.addScaledVector(this.right(), -dx * s).addScaledVector(this.fwd(), dy * s); this.clampTarget(); },
  zoom(f) { this.dist = clamp(this.dist * f, 3, 1600 * Env.viewScale); },
  clampTarget() { const L = 600 * Env.viewScale; this.target.x = clamp(this.target.x, -L, L); this.target.z = clamp(this.target.z, -L, L); this.target.y = clamp(this.target.y, -20, 900 * Env.viewScale); },
  focus(p, dist) { this.goal = { p: p.clone(), d: dist || this.dist }; },
  update(dt) {
    const k = this.keys, sp = Math.max(20, this.dist) * 0.9 * dt * (k.shift ? 2.5 : 1) * this.sens();
    if (k.w || k.arrowup) { this.target.addScaledVector(this.fwd(), sp); this.goal = null; }
    if (k.s || k.arrowdown) { this.target.addScaledVector(this.fwd(), -sp); this.goal = null; }
    if (k.a || k.arrowleft) { this.target.addScaledVector(this.right(), -sp); this.goal = null; }
    if (k.d || k.arrowright) { this.target.addScaledVector(this.right(), sp); this.goal = null; }
    if (k.q) this.yaw += 1.6 * dt * this.sens(); if (k.e) this.yaw -= 1.6 * dt * this.sens();
    if (k.r) this.zoom(1 - dt * 1.5); if (k.f && !k.ctrl) this.zoom(1 + dt * 1.5);
    if (this.goal) {
      const a = 1 - Math.exp(-dt * 6);
      this.target.lerp(this.goal.p, a); this.dist = lerp(this.dist, this.goal.d, a);
      if (this.target.distanceTo(this.goal.p) < 0.05) this.goal = null;
    }
    this.clampTarget();
  },
  apply(cam) {
    const cp = Math.cos(this.pitch);
    cam.position.set(this.target.x + Math.sin(this.yaw) * cp * this.dist, this.target.y + Math.sin(this.pitch) * this.dist, this.target.z + Math.cos(this.yaw) * cp * this.dist);
    const gy = Terrain.groundAt(cam.position.x, cam.position.z) + 1.5;
    if (cam.position.y < gy) cam.position.y = gy;
    cam.up.set(0, 1, 0); cam.lookAt(this.target);
    if (cam.fov !== 60) { cam.fov = 60; cam.updateProjectionMatrix(); }
  }
};

          [['starter', '✨ Starter layout', 'A complete, rideable circuit to remix: station, lift, drop, hills, turnaround and brakes.'], ['blank', '🏁 Blank canvas', 'Just a station. Build everything yourself with nodes and elements.']].map(([k, t, dsc]) =>
            el('div', { class: 'card', style: layout === k ? 'border-color:var(--accent2);background:rgba(42,209,196,.1)' : '', onclick: () => { layout = k; render(); } }, el('div', { class: 'cb' }, el('div', { class: 't' }, t), el('div', { class: 'a' }, dsc))))));
    };
    render();
    Modal.open(challenge ? 'Challenge: ' + challenge.name : 'New Coaster', body, [el('button', { onclick: () => Modal.close() }, 'Cancel'), el('button', {
      class: 'primary', onclick: () => {
        const d = layout === 'starter' ? Design.starter(style) : Design.stationOnly(style);
        Challenges.active = challenge || null;
        d.name = challenge ? challenge.name + ' attempt' : (layout === 'starter' ? 'My First Coaster' : 'Untitled Coaster');
        this.openDesign(d);
        toast(layout === 'starter' ? 'Starter layout ready. Press T to test ride!' : 'Select the end node and add track with the Add tool (2) or the Elements tab.', 'good', 4000);
      }
    }, 'Start building →')]);
  },
  savesList() { return Store.get('sky.saves.v1', []); },
  saveDialog() {
    if (!Editor.design) return;
    const d = Editor.serialize(true); d.name = Editor.design.name || 'Untitled Coaster';
    const thumb = captureScreenshot(256, 144);
    const list = this.savesList().filter(s => s.id !== d.id);
    list.unshift({ id: d.id, name: d.name, updated: Date.now(), thumb, silly: Design.isSilly(d) || Settings.d.silly, design: d });
    if (Store.set('sky.saves.v1', list.slice(0, 40))) { toast('💾 Saved “' + d.name + '”', 'good'); Sound.blip(880); }
  },
  exportDesign(d) {
    const blob = new Blob([JSON.stringify(d)], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = (d.name || 'coaster').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '.skyline.json';
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  loadDialog() {
    const body = el('div');
    const file = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    file.addEventListener('change', () => {
      const f = file.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { try { const d = Design.validate(JSON.parse(rd.result)); d.id = uid(); this.openDesign(d); toast('Imported “' + d.name + '”', 'good'); } catch (e) { toast('Import failed: ' + e.message, 'bad', 4000); } };
      rd.readAsText(f);
    });
    const render = () => {
      body.innerHTML = '';
      const list = this.savesList();
      body.append(el('div', { class: 'row', style: 'margin-bottom:12px' }, el('button', { onclick: () => file.click() }, '📥 Import JSON…'),
        Editor.design && this.state !== 'menu' ? el('button', { onclick: () => this.exportDesign(Editor.serialize(true)) }, '📤 Export current coaster') : null, file));
      if (!list.length) body.append(el('p', { class: 'muted' }, 'No saved coasters yet. Use 💾 Save in the editor.'));
      list.forEach(s => body.append(el('div', { class: 'list-item' }, el('img', { src: s.thumb || '' }),
        el('div', { class: 'grow' }, el('b', null, s.name, ' ', s.silly ? el('span', { class: 'tag silly' }, 'SILLY') : null), el('div', { class: 'muted' }, STYLES[s.design.style] ? STYLES[s.design.style].name : '', ' · ', s.design.nodes.length + ' nodes · saved ' + timeAgo(s.updated))),
        el('button', { class: 'primary', onclick: () => { try { this.openDesign(Design.validate(Design.clone(s.design))); } catch (e) { toast('Could not load: ' + e.message, 'bad'); } } }, 'Load'),
        el('button', { onclick: () => this.exportDesign(s.design) }, 'Export'),
        el('button', { class: 'danger', onclick: () => { Store.set('sky.saves.v1', this.savesList().filter(x => x.id !== s.id)); render(); } }, '✖'))));
    };
    render();
    Modal.open('Your Coasters', body);
  },
  settingsDialog() {
    const S = Settings.d, body = el('div');
    const save = () => { Settings.save(); };
    const name = el('input', { type: 'text', value: S.playerName, maxlength: 24, style: 'flex:1' });
    name.addEventListener('keydown', e => e.stopPropagation()); name.addEventListener('change', () => { S.playerName = name.value.trim() || S.playerName; save(); });
    const silly = uiCheck('Silly Mode', S.silly, v => {
      S.silly = v; save(); this.updateSillyBadges();
      if (Editor.design) { Editor.renderPanel(); Editor.schedulePreview(); }
      toast(v ? '🤪 Silly Mode ON. Physics has been notified.' : 'Silly Mode off. Safety limits restored.', v ? 'silly' : '', 3200); if (v) Sound.fanfare();
    });
    silly.querySelector('label').style.cssText = 'flex:1;font-weight:800;font-size:14px;background:linear-gradient(90deg,#ff4fd8,#ffb14f,#4fffb0,#4fb7ff);-webkit-background-clip:text;background-clip:text;color:transparent';
    const keys = [
      ['Right-drag', 'Orbit camera'], ['Middle-drag / Shift+Right-drag', 'Pan camera'], ['Mouse wheel', 'Zoom'], ['W A S D / arrows', 'Move camera'], ['Q / E', 'Rotate camera'], ['R / F', 'Zoom in / out'],
      ['1 – 6', 'Tools: Select, Add, Insert, Delete, Terrain, Scenery'], ['Click / Shift+click / Ctrl+click', 'Select node / range / toggle'], ['Drag · Shift+drag', 'Move node · change height'],
      ['PgUp / PgDn', 'Raise / lower selection (Shift = 5 m)'], [', / .', 'Roll selection −/+ 5° (Shift = 15°)'], ['[ / ]', 'Previous / next node'], ['I', 'Insert node at midpoint after selection'],
      ['Delete', 'Delete selected nodes'], ['Ctrl+Z / Ctrl+Y', 'Undo / redo'], ['Ctrl+C / Ctrl+V', 'Copy / paste track section'], ['Ctrl+A', 'Select all nodes'], ['M', 'Mirror selection (or whole track)'],
      ['G', 'Toggle grid snapping'], ['H', 'Toggle G-force heatmap'], ['C', 'Focus camera on selection (editor) · cycle camera (ride)'], ['T', 'Test ride'], ['Ctrl+S', 'Save'],
      ['Esc', 'Stop ride / deselect / close dialog'], ['[ / ] (ride)', 'Slower / faster simulation'], ['U (ride)', 'Toggle mph / km/h']];
    body.append(
      sec('Silly Mode', silly, el('div', { class: 'hint' }, 'Unlocks the Accelerator (0–600 mph in as little as 0.1 s), low gravity, super-loops and a rainbow train. Removes speed and G limits, and safety warnings become… less serious. Silly coasters are tagged and listed in their own community category.')),
      sec('Graphics', (() => {
        const row = uiSlider('Graphics', 1, 5, 1, Gfx.lv(), v => { S.gfx = v; }, v => Gfx.names[v - 1], v => {
          S.gfx = v; save(); applyGraphics();
          toast('Graphics: ' + Gfx.name() + (Gfx.antialias() !== R.aa ? ' · reload the page to switch anti-aliasing ' + (Gfx.antialias() ? 'on' : 'off') : ''));
        });
        return row;
      })(),
        el('div', { class: 'hint' }, 'Potato: no shadows, minimal effects · Low: sky reflections · Medium: shadows, ground detail, grass · High: soft shadows, full-detail track, more grass · Ultra: 4K shadows, dense grass, max resolution.'),
        uiCheck('Show FPS counter', S.showFps, v => { S.showFps = v; save(); $('#fps').classList.toggle('hidden', !v); })),
      sec('Controls', uiSlider('Camera sensitivity', 0.3, 2.5, 0.05, S.camSens, v => { S.camSens = v; save(); }, v => v.toFixed(2) + '×'),
        uiCheck('Invert vertical orbit', S.invertOrbit, v => { S.invertOrbit = v; save(); })),
      sec('Units', uiSelect('Unit system', [['imperial', 'Imperial (mph, ft)'], ['metric', 'Metric (km/h, m)']], S.units, v => { S.units = v; save(); if (Editor.design) { Editor.renderPanel(); Editor.updateBottomBar(); } })),
      sec('Sound', uiSlider('Volume', 0, 1, 0.05, S.volume, v => { S.volume = v; save(); Sound.setVolume(); }, v => Math.round(v * 100) + '%'), uiCheck('Mute', S.muted, v => { S.muted = v; save(); Sound.setVolume(); })),
      sec('Profile', el('div', { class: 'field' }, el('label', null, 'Player name'), name)),
      sec('Keybinds', el('div', { class: 'keys' }, keys.flatMap(([k, d]) => [el('div', null, ...k.split(' / ').flatMap((p, i) => [i ? ' / ' : null, el('kbd', null, p)])), el('div', { class: 'muted' }, d)]))));
    Modal.open('Settings', body, [el('button', { class: 'primary', onclick: () => Modal.close() }, 'Done')]);
  },
  challengesDialog() {
    const done = Challenges.done(), body = el('div');
    body.append(el('p', { class: 'muted', style: 'margin-top:0' }, 'Optional goals to test your skills. Goals are checked live in the editor and confirmed by a real test ride. ' + Object.keys(done).length + ' / ' + CHALLENGES.length + ' complete.'));
    CHALLENGES.forEach(ch => {
      const locked = ch.silly && !Settings.d.silly;
      body.append(el('div', { class: 'chal', style: locked ? 'opacity:.55' : '' },
        el('div', { style: 'font-size:26px' }, done[ch.id] ? '🏆' : ch.silly ? '🤪' : '🎯'),
        el('div', { class: 'grow' }, el('b', null, ch.name), ' ', ch.silly ? el('span', { class: 'tag silly' }, 'SILLY') : null, done[ch.id] ? el('span', { class: 'done' }, '  ✔ Complete') : null,
          el('div', { class: 'muted' }, ch.desc), el('div', { class: 'hint' }, ch.goals.map(g => g[0]).join(' · '))),
        locked ? el('span', { class: 'muted' }, 'Needs Silly Mode') : el('div', { style: 'display:flex;flex-direction:column;gap:4px' },
          el('button', { class: 'primary', onclick: () => this.newDialog(ch) }, 'New attempt'),
          Editor.design && this.state === 'editor' ? el('button', { onclick: () => { Challenges.active = ch; Modal.close(); Editor.updateChallengeBox(); Editor.schedulePreview(); } }, 'Use current') : null)));
    });
    Modal.open('Challenges', body);
  },
  bindInput() {
    const cv = R.renderer.domElement; let camDrag = null;
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('pointerdown', e => {
      cv.focus(); Sound.init();
      const orbitCam = this.state === 'editor' || (this.state === 'ride' && Ride.cams[Ride.cam] === 'orbit');
      if (orbitCam && (e.button === 2 || e.button === 1)) { camDrag = { x: e.clientX, y: e.clientY, pan: e.button === 1 || e.shiftKey }; cv.setPointerCapture(e.pointerId); return; }
      if (this.state === 'editor' && Editor.onDown(e)) cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', e => {
      if (camDrag) { const dx = e.clientX - camDrag.x, dy = e.clientY - camDrag.y; camDrag.x = e.clientX; camDrag.y = e.clientY; camDrag.pan ? Cam.pan(dx, dy) : Cam.orbit(dx, dy); return; }
      if (this.state === 'editor') Editor.onMove(e);
    });
    const up = e => { if (camDrag) { camDrag = null; return; } if (this.state === 'editor') Editor.onUp(e); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', () => { if (this.state === 'editor') { Editor.ghost.visible = false; $('#cursorInfo').classList.add('hidden'); } });
    cv.addEventListener('wheel', e => { e.preventDefault(); if (this.state === 'editor' || (this.state === 'ride' && Ride.cams[Ride.cam] === 'orbit')) Cam.zoom(Math.pow(1.0015, e.deltaY * (Settings.d.camSens || 1))); }, { passive: false });
    window.addEventListener('keydown', e => {
      const tag = (e.target.tagName || '').toLowerCase();
      if ((tag === 'input' || tag === 'textarea' || tag === 'select') && e.key !== 'Escape') return;
      const k = e.key.toLowerCase();
      if (Modal.isOpen) { if (k === 'escape') Modal.close(); return; }
      if (['w', 'a', 's', 'd', 'q', 'e', 'r', 'f', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'shift'].includes(k) && !e.ctrlKey && !e.metaKey) Cam.keys[k] = true;
      if (this.state === 'ride') {
        if (k === 'escape') Ride.stop(); else if (k === 'c') Ride.cycleCam(); else if (k === '[') Ride.cycleSpeed(-1); else if (k === ']') Ride.cycleSpeed(1);
        else if (k === 'u') Units.toggle(); else if (k === ' ') Ride.restart(); else return;
        e.preventDefault(); return;
      }
      if (this.state === 'editor') { if (Editor.onKey(e, true)) e.preventDefault(); }
      else if (this.state === 'menu' && k === 'escape') Modal.close();
    });
    window.addEventListener('keyup', e => { Cam.keys[e.key.toLowerCase()] = false; if (e.key === 'Shift') Cam.keys.shift = false; });
    window.addEventListener('blur', () => { Cam.keys = {}; });
  },
  renderFrame() { R.renderer.render(R.scene, R.camera); },
  loop(t) {
    requestAnimationFrame(tt => this.loop(tt));
    const dt = Math.min(0.1, Math.max(0, (t - this.last) / 1000)); this.last = t;
    let focus = null;
    try {
      if (this.state === 'menu') focus = Attract.update(dt);
      else if (this.state === 'editor') { Cam.update(dt); Editor.update(dt); Cam.apply(R.camera); focus = Cam.target; }
      else if (this.state === 'ride') focus = Ride.update(dt);
    } catch (err) { console.error(err); }
    if (Editor.design && Editor.design.rainbow && Train.group.visible === false) { /* idle */ }
    Env.update(dt, R.camera, focus);
    Terrain.tick(dt, t);
    this.renderFrame();
    this.frames++; this.fpsT += dt;
    if (this.fpsT > 0.5) { if (Settings.d.showFps) $('#fps').textContent = Math.round(this.frames / this.fpsT) + ' fps · ' + R.renderer.info.render.calls + ' draws'; this.frames = 0; this.fpsT = 0; }
  }
};

window.Skyline = { App, Editor, Ride, Sim, Track, Design, Community, Settings, Samples, Ratings, Cam, Env, Terrain, Train, Scenery, Gfx, Challenges, CHALLENGES, R };
window.addEventListener('load', () => {
  if (!window.THREE) { $('#loading').textContent = 'Could not load Three.js. Check your internet connection.'; return; }
  try { App.init(); if (Settings.d.showFps) $('#fps').classList.remove('hidden'); }
  catch (e) { console.error(e); $('#loading').textContent = 'Something went wrong: ' + e.message; }
});

</script>
