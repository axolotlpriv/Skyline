<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skyline Coaster Studio</title>
<style>
:root{
  --bg:#0b1322;--panel:rgba(12,20,38,.9);--panel2:rgba(28,42,72,.92);--line:rgba(255,255,255,.09);
  --text:#e9eff9;--muted:#8fa0bf;--accent:#ff6b3d;--accent2:#2ad1c4;--warn:#ffc547;--bad:#ff4d6a;--good:#4ee38a;--silly:#ff4fd8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;color:var(--text);user-select:none;-webkit-user-select:none}
#viewport{position:fixed;inset:0}
#viewport canvas{display:block;outline:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;transition:background .12s,border-color .12s,transform .08s;white-space:nowrap}
button:hover{background:#2b4070;border-color:rgba(255,255,255,.22)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:linear-gradient(135deg,#ff8247,#ff4d6a);border:none;font-weight:650;color:#fff}
button.primary:hover{filter:brightness(1.1)}
button.teal{background:linear-gradient(135deg,#2ad1c4,#2a8fd1);border:none;font-weight:650;color:#04121c}
button.active{background:var(--accent2);color:#03161a;border-color:transparent;font-weight:600}
button.ghost{background:transparent}
button.danger{background:rgba(255,77,106,.18);border-color:rgba(255,77,106,.4)}
input,select,textarea{font:inherit;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:5px 7px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent2)}
textarea{resize:vertical;width:100%;min-height:60px;user-select:text}
input[type=text]{user-select:text}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;padding:0;background:rgba(255,255,255,.15);border:none;border-radius:3px;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent2);cursor:pointer;border:2px solid #0b1322}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent2);cursor:pointer;border:2px solid #0b1322}
input[type=checkbox]{accent-color:var(--accent2);width:15px;height:15px;margin:0}
input[type=color]{padding:0;width:34px;height:24px;border:none;background:none;cursor:pointer}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.03em;background:rgba(255,255,255,.12)}
.tag.silly{background:linear-gradient(90deg,#ff4fd8,#ffb14f,#4fffb0,#4fb7ff);color:#1a0820}
.tag.normal{background:rgba(42,209,196,.22);color:#9ff5ec}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}

/* ---------- main menu ---------- */
#menu{position:fixed;inset:0;display:flex;align-items:center;background:linear-gradient(90deg,rgba(5,10,22,.92) 0%,rgba(5,10,22,.6) 38%,rgba(5,10,22,0) 70%)}
.menu-inner{margin-left:7vw;width:380px;max-width:86vw}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.logo svg{width:84px;height:84px;filter:drop-shadow(0 4px 14px rgba(255,107,61,.45))}
.logo h1{margin:0;font-size:46px;letter-spacing:.09em;font-weight:900;line-height:1;background:linear-gradient(135deg,#fff 0%,#ffd2b8 45%,#ff6b3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .sub{font-size:13px;letter-spacing:.42em;color:var(--accent2);font-weight:700;margin-top:6px}
.menu-buttons{display:flex;flex-direction:column;gap:10px}
.menu-buttons button{font-size:17px;padding:13px 20px;text-align:left;border-radius:12px;background:rgba(18,30,56,.78);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px}
.menu-buttons button .ico{width:26px;text-align:center;font-size:18px}
.menu-buttons button:hover{background:rgba(42,64,112,.9);transform:translateX(4px)}
.menu-buttons button.primary{background:linear-gradient(135deg,#ff8247,#ff4d6a)}
.menu-foot{margin-top:26px;color:var(--muted);font-size:12px}
#sillyBadge{position:fixed;top:14px;right:16px;z-index:30}

/* ---------- editor ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:10;backdrop-filter:blur(8px)}
#topbar .brand{font-weight:900;letter-spacing:.12em;color:#ffd2b8;margin-right:6px;font-size:15px;display:flex;align-items:center;gap:6px}
#topbar .brand svg{width:26px;height:26px}
#topbar input.name{width:190px;font-weight:600}
#topbar .sep{width:1px;height:26px;background:var(--line);margin:0 2px}
#toolbar{position:fixed;top:60px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:10}
#toolbar button{width:46px;height:46px;padding:0;font-size:19px;border-radius:12px;background:var(--panel);position:relative}
#toolbar button.active{background:var(--accent2)}
#toolbar button .k{position:absolute;right:3px;bottom:1px;font-size:9px;opacity:.6}
#toolbar .tsep{height:6px}
#panel{position:fixed;top:58px;right:10px;width:300px;bottom:60px;background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:10;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(8px)}
#panelTabs{display:flex;flex-wrap:wrap;gap:3px;padding:7px;border-bottom:1px solid var(--line)}
#panelTabs button{padding:4px 8px;font-size:12px;border-radius:6px;flex:1}
#panelBody{flex:1;overflow-y:auto;padding:10px 12px 16px}
#panelBody::-webkit-scrollbar{width:7px}#panelBody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}
.sec{margin-bottom:14px}
.sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.field{display:flex;align-items:center;gap:8px;margin:7px 0}
.field label{width:96px;flex-shrink:0;color:#c5d1e6;font-size:12px}
.field .val{width:62px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid2 button,.grid3 button{padding:7px 4px;font-size:12px}
.hint{font-size:11.5px;color:var(--muted);margin:6px 0}
.piece-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
#bottombar{position:fixed;left:68px;right:320px;bottom:10px;min-height:42px;background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:10;display:flex;align-items:center;gap:14px;padding:6px 14px;font-size:12.5px;backdrop-filter:blur(8px);flex-wrap:wrap}
#bottombar .stat b{color:#fff;font-variant-numeric:tabular-nums}
#bottombar .stars{color:#ffc547;letter-spacing:1px}
#bottombar .warnings{color:var(--warn);flex:1;min-width:120px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#challengeBox{position:fixed;left:68px;top:60px;width:260px;background:var(--panel);border:1px solid rgba(255,197,71,.4);border-radius:12px;padding:10px 12px;z-index:9;font-size:12.5px}
#challengeBox h4{margin:0 0 6px;color:var(--warn)}
#challengeBox .goal{display:flex;gap:6px;margin:3px 0}
#challengeBox .goal.ok{color:var(--good)}
#cursorInfo{position:fixed;pointer-events:none;z-index:12;background:rgba(0,0,0,.65);padding:3px 7px;border-radius:5px;font-size:11.5px;transform:translate(14px,14px)}

/* ---------- ride HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud .box{position:absolute;background:rgba(6,12,26,.72);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);padding:10px 14px}
#hudSpeed{left:16px;bottom:16px;min-width:210px;pointer-events:auto;cursor:pointer}
#hudSpeed .big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#hudSpeed .unit{font-size:16px;color:var(--muted);margin-left:4px}
#hudSpeed .sub{color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
#hudG{right:16px;top:16px;width:300px}
#hudG .gs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;text-align:center}
#hudG .gs div{background:rgba(255,255,255,.05);border-radius:8px;padding:4px}
#hudG .gs b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
#hudG .gs small{font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
#gGraph{width:272px;height:96px;display:block}
#hudTop{left:50%;top:16px;transform:translateX(-50%);text-align:center;min-width:260px}
#hudTop .seg{font-weight:700;letter-spacing:.06em}
#hudWarn{position:absolute;left:50%;top:86px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
#hudWarn div{background:rgba(255,77,106,.88);color:#fff;font-weight:700;padding:7px 14px;border-radius:10px;animation:pop .25s ease-out}
#hudWarn div.silly{background:linear-gradient(90deg,#ff4fd8,#8a4fff);}
#hudWarn div.info{background:rgba(42,209,196,.9);color:#03161a}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#hudCtl{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;pointer-events:auto}
#hudCtl .muted{font-size:11.5px}

/* ---------- modal ---------- */
#modalWrap{position:fixed;inset:0;background:rgba(2,6,14,.62);z-index:40;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal{background:linear-gradient(180deg,#14213d,#0e182d);border:1px solid rgba(255,255,255,.12);border-radius:18px;width:min(720px,94vw);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .18s ease-out}
#modal.wide{width:min(1100px,96vw);height:88vh}
#modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
#modal .mh h2{margin:0;font-size:19px;flex:1}
#modal .mb{padding:16px 18px;overflow-y:auto;flex:1}
#modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.12s;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent2);transform:translateY(-2px)}
.card .thumb{aspect-ratio:16/9;background:#1a2a48 center/cover;position:relative}
.card .thumb .tag{position:absolute;top:7px;left:7px}
.card .cb{padding:8px 10px}
.card .cb .t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cb .a{color:var(--muted);font-size:12px}
.card .cb .m{display:flex;gap:8px;margin-top:5px;font-size:11.5px;color:#c7d3ea;flex-wrap:wrap}
.stars{color:#ffc547}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.statgrid div{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px}
.statgrid small{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.statgrid b{font-size:18px;font-variant-numeric:tabular-nums}
.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.ratings div{border-radius:12px;padding:10px;text-align:center;background:rgba(255,255,255,.06)}
.ratings b{display:block;font-size:30px;font-weight:800}
.ratings small{color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.1em}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%}
.warnlist div{padding:6px 10px;border-radius:8px;margin:4px 0;background:rgba(255,197,71,.12);color:#ffe2a0}
.warnlist div.silly{background:rgba(255,79,216,.14);color:#ffc2f2}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.comment{background:rgba(255,255,255,.04);border-radius:8px;padding:7px 10px;margin:6px 0}
.comment b{color:var(--accent2)}
.starpick span{font-size:26px;cursor:pointer;color:#56627a;transition:.1s}
.starpick span.on{color:#ffc547}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
kbd{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:600 11.5px ui-monospace,Menlo,monospace;color:#fff;margin-right:2px}
.list-item{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:8px}
.list-item img{width:128px;height:72px;object-fit:cover;border-radius:7px;background:#1a2a48}
.chal{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:8px;border:1px solid var(--line)}
.chal .done{color:var(--good);font-weight:700}
#toasts{position:fixed;bottom:66px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none}
#toasts div{background:rgba(10,18,34,.95);border:1px solid var(--line);padding:8px 16px;border-radius:10px;animation:pop .2s ease-out;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toasts div.good{border-color:var(--good)}#toasts div.bad{border-color:var(--bad)}#toasts div.silly{border-color:var(--silly)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1322;z-index:100;font-size:18px;letter-spacing:.2em;color:var(--accent2)}
#fps{position:fixed;left:70px;bottom:60px;z-index:11;font:11px monospace;color:#9f9}
@media (max-width:900px){#panel{width:250px}#bottombar{right:270px}}
</style>
</head>
<body>
<div id="viewport"></div>
<div id="loading">LOADING SKYLINE…</div>

<div id="menu" class="hidden">
  <div class="menu-inner">
    <div class="logo">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffd2b8"/><stop offset="1" stop-color="#ff4d6a"/></linearGradient></defs>
        <path d="M6 82 C 26 82, 30 20, 50 20 C 70 20, 74 60, 62 64 C 50 68, 44 46, 58 40 C 72 34, 82 70, 96 82" fill="none" stroke="url(#lg)" stroke-width="8" stroke-linecap="round"/>
        <path d="M6 92 H96" stroke="#2ad1c4" stroke-width="4" stroke-linecap="round"/></svg>
      <div><h1>SKYLINE</h1><div class="sub">COASTER STUDIO</div></div>
    </div>
    <div class="menu-buttons">
      <button class="primary" data-act="new"><span class="ico">✚</span>New Coaster</button>
      <button data-act="continue" id="btnContinue"><span class="ico">⟲</span>Continue Last Design</button>
      <button data-act="load"><span class="ico">📂</span>Load</button>
      <button data-act="community"><span class="ico">🌐</span>Community</button>
      <button data-act="challenges"><span class="ico">🏆</span>Challenges</button>
      <button data-act="settings"><span class="ico">⚙</span>Settings</button>
    </div>
    <div class="menu-foot">Design · Test · Share — build the ride of your dreams.<br><span id="menuSilly"></span></div>
  </div>
</div>

<div id="editor" class="hidden">
  <div id="topbar">
    <div class="brand"><svg viewBox="0 0 100 100"><path d="M6 82 C 26 82, 30 20, 50 20 C 70 20, 74 60, 62 64 C 50 68, 44 46, 58 40 C 72 34, 82 70, 96 82" fill="none" stroke="#ff6b3d" stroke-width="10" stroke-linecap="round"/></svg>SKYLINE</div>
    <button id="btnMenu" title="Main menu">☰ Menu</button>
    <input class="name" id="coasterName" type="text" maxlength="40" placeholder="Coaster name">
    <div class="sep"></div>
    <button id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
    <button id="btnCopy" title="Copy selected nodes (Ctrl+C)">⧉ Copy</button>
    <button id="btnPaste" title="Paste after selected node (Ctrl+V)">📋 Paste</button>
    <button id="btnMirror" title="Mirror selection / whole track (M)">⇋ Mirror</button>
    <button id="btnSnap" title="Grid snapping (G)">▦ Snap</button>
    <button id="btnHeat" title="G-force heatmap (H)">🌡 Heatmap</button>
    <div class="grow"></div>
    <span id="sillyTop"></span>
    <button id="btnSave" title="Save (Ctrl+S)">💾 Save</button>
    <button id="btnPublish" title="Publish to the community board">🌐 Publish</button>
    <button id="btnSettings" title="Settings">⚙</button>
    <button id="btnTest" class="primary" title="Test ride (T)">▶ Test Ride</button>
  </div>
  <div id="toolbar"></div>
  <div id="panel"><div id="panelTabs"></div><div id="panelBody"></div></div>
  <div id="bottombar"></div>
  <div id="challengeBox" class="hidden"></div>
</div>
<div id="cursorInfo" class="hidden"></div>

<div id="hud" class="hidden">
  <div class="box" id="hudTop"><div class="seg" id="hudSeg">STATION</div><div class="muted" id="hudTime">0:00</div></div>
  <div id="hudWarn"></div>
  <div class="box" id="hudSpeed" title="Click to toggle mph / km/h"><div><span class="big" id="hudV">0</span><span class="unit" id="hudVU">mph</span></div><div class="sub" id="hudH">Height 0 ft</div></div>
  <div class="box" id="hudG">
    <div class="gs"><div><small>Vertical</small><b id="gV">1.0</b></div><div><small>Lateral</small><b id="gL">0.0</b></div><div><small>Longit.</small><b id="gF">0.0</b></div></div>
    <canvas id="gGraph" width="544" height="192"></canvas>
    <div class="row muted" style="font-size:11px;margin-top:4px;gap:12px"><span style="color:#5fb7ff">■ vertical</span><span style="color:#ffa64d">■ lateral</span><span style="color:#5fe39a">■ longitudinal</span></div>
  </div>
  <div class="box" id="hudCtl">
    <button id="btnCam">🎥 Camera: Ride</button>
    <button id="btnSlow">⏱ 1×</button>
    <button id="btnRestart">⟲ Restart</button>
    <button id="btnStop" class="primary">■ Stop (Esc)</button>
  </div>
</div>

<div id="modalWrap" class="hidden"><div id="modal"></div></div>
<div id="toasts"></div>
<div id="fps" class="hidden"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   SKYLINE COASTER STUDIO
   A roller coaster design / test / share sandbox. Single file, Three.js r128.

   Architecture (top to bottom):
     Core utils, Store, Settings, Units, UI helpers
     Sound           – Web Audio synthesis (wind, rumble, chain, screams)
     Terrain         – heightmap + water, brushes, ray-marching picker
     Env             – sky dome, sun/moon, day/night cycle, weather
     Scenery         – instanced procedural props
     Track           – spline (per-node Hermite) -> arc-length samples -> frames
     PathBuilder     – element templates (loops, rolls, helixes...) as plain nodes
     TrackRenderer   – rails / ties / piece fins / station / supports / lights
     Train           – car meshes
     Sim             – substepped energy-based train integrator + telemetry
     Ratings         – excitement / intensity / nausea / stars
     Challenges
     Community       – backend interface + LocalStorage implementation + UI
     Editor          – tools, selection, undo/redo, copy/paste, mirror
     Ride            – live test mode, HUD, cameras
     App             – screens, main loop
   ===================================================================== */

const $ = s => document.querySelector(s);
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = t => t * t * (3 - 2 * t);
const G0 = 9.81, MPH = 2.236936, KMH = 3.6, FT = 3.28084;
const DS = 0.5;                       // physics sample spacing along the track (m)
const V3 = THREE.Vector3;
const UPV = new V3(0, 1, 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const wrapDeg = d => { d = ((d + 180) % 360 + 360) % 360 - 180; return d === -180 ? 180 : d; };
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function timeAgo(t) { const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; }
function fmtTime(s) { s = Math.max(0, s); const m = Math.floor(s / 60); return m + ':' + String(Math.floor(s % 60)).padStart(2, '0'); }

/* ---------------- Storage ---------------- */
const Store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },

    let N = st.maxLat * 1.3 + st.inversions * 0.42 + Math.min(2.5, st.jerk * 0.1) + Math.min(1.5, st.highLatT * 0.12) +
      Math.max(0, st.maxVG - 3.5) * 0.45 + Math.min(1.5, st.maxRollRate / 260);
    let E = 0.8 + Math.min(2.4, mph / 30) + Math.min(2.2, st.airtime * 0.42) + Math.min(1.9, st.inversions * 0.45) + Math.min(1.2, st.drop / 40) +
      Math.min(0.9, st.length / 900) + Math.min(0.7, st.duration / 100) + (st.launches ? 0.5 : 0) + Math.max(0, 0.8 - st.jerk * 0.04);
    const rawI = I;
    if (I > 7.5) E -= (I - 7.5) * (silly ? 0.25 : 0.8);
    if (N > 6) E -= (N - 6) * (silly ? 0.2 : 0.6);
    if (st.result !== 'complete') E *= 0.4;
    if (st.unsafe && !silly) E *= 0.55;
    E = clamp(E, 0, 10); I = clamp(I, 0, 10); N = clamp(N, 0, 10);
    const smoothness = clamp(10 - st.jerk * 0.5, 0, 10);
    let sc = E / 2 + (I >= 3 && I <= 7.5 ? 0.3 : 0) - Math.max(0, N - 6.5) * 0.25;
    let stars = clamp(Math.round(sc * 2) / 2, 0.5, 5);
    if (st.result !== 'complete') stars = Math.min(stars, 1);
    return { excitement: +E.toFixed(2), intensity: +I.toFixed(2), nausea: +N.toFixed(2), stars, smoothness: +smoothness.toFixed(1), offCharts: rawI > 10 };
  },
  label(v) { return v < 2 ? 'Very Low' : v < 4 ? 'Low' : v < 6 ? 'Medium' : v < 8 ? 'High' : 'Very High'; },
  color(v) { return v < 4 ? '#4ee38a' : v < 6.5 ? '#ffc547' : v < 8.5 ? '#ff8a3d' : '#ff4d6a'; }
};

   CHALLENGES

  { id: 'speed', name: 'Speed Demon', desc: 'Hit 70 mph using nothing but gravity.', goals: [['Top speed 70 mph (113 km/h)+', s => s.maxSpeed * MPH >= 70], ['No launch sections', s => s.launches === 0], ['Ride completes', s => s.result === 'complete']] },
  { id: 'family', name: 'Family Favourite', desc: 'Fun for grandma and the grandkids.', goals: [['Intensity 4.0 or lower', (s, r) => r.intensity <= 4], ['Excitement 4.5 or higher', (s, r) => r.excitement >= 4.5], ['Ride completes', s => s.result === 'complete']] },
  { id: 'compact', name: 'Compact Chaos', desc: 'Maximum thrills in a tiny footprint.', goals: [['Track length 500 m or less', s => s.length <= 500], ['Excitement 6.0 or higher', (s, r) => r.excitement >= 6], ['Ride completes', s => s.result === 'complete']] },
  { id: 'woodie', name: 'Timber Tradition', desc: 'A classic woodie: airtime, no loops.', goals: [['Wooden track style', s => s.style === 'wooden'], ['3+ seconds of airtime', s => s.airtime >= 3], ['No inversions', s => s.inversions === 0], ['Ride completes', s => s.result === 'complete']] },
  { id: 'launch', name: 'Launch Master', desc: 'Launch to 100 mph and live to tell the tale.', goals: [['Has a launch', s => s.launches > 0], ['Top speed 100 mph+', s => s.maxSpeed * MPH >= 100], ['No safety warnings', s => !s.unsafe], ['Ride completes', s => s.result === 'complete']] },
  { id: 'smooth', name: 'Butter Smooth', desc: 'Inversions so smooth you could balance a coffee.', goals: [['2+ inversions', s => s.inversions >= 2], ['Smoothness 8.0+', (s, r) => r.smoothness >= 8], ['Max lateral G under 1.2', s => s.maxLat < 1.2], ['Ride completes', s => s.result === 'complete']] },
  { id: 'escape', name: 'Escape Velocity', silly: true, desc: 'SILLY: reach 500 mph. Your riders signed a waiver. Probably.', goals: [['Top speed 500 mph+', s => s.maxSpeed * MPH >= 500], ['Ride completes', s => s.result === 'complete']] },
  { id: 'g100', name: 'The 100 G Club', silly: true, desc: 'SILLY: experience a peak of 100 vertical G.', goals: [['Peak vertical G of 100+', s => s.maxVG >= 100], ['Ride completes', s => s.result === 'complete']] }
];
const Challenges = {
  active: null,
  done() { return Store.get('sky.challenges', {}); },
  evaluate(ch, st, rt) { return ch.goals.map(([label, fn]) => ({ label, ok: !!(st && fn(st, rt || {})) })); },
  markDone(id) { const d = this.done(); if (!d[id]) { d[id] = Date.now(); Store.set('sky.challenges', d); return true; } return false; }
};
