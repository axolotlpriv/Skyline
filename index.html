  bindInput() {
    const cv = R.renderer.domElement; let camDrag = null;
    cv.addEventListener('contextmenu', e => e.preventDefault());
    cv.addEventListener('pointerdown', e => {
      cv.focus(); Sound.init();
      const orbitCam = this.state === 'editor' || (this.state === 'ride' && Ride.cams[Ride.cam] === 'orbit');
      if (orbitCam && (e.button === 2 || e.button === 1)) { camDrag = { x: e.clientX, y: e.clientY, pan: e.button === 1 || e.shiftKey }; if (!camDrag.pan) Builder.userOrbit = true; cv.setPointerCapture(e.pointerId); return; }
      if (this.state === 'editor' && Editor.onDown(e)) cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', e => {
      if (camDrag) { const dx = e.clientX - camDrag.x, dy = e.clientY - camDrag.y; camDrag.x = e.clientX; camDrag.y = e.clientY; camDrag.pan ? Cam.pan(dx, dy) : Cam.orbit(dx, dy); return; }
      if (this.state === 'editor') Editor.onMove(e);
    });
    const up = e => { if (camDrag) { camDrag = null; return; } if (this.state === 'editor') Editor.onUp(e); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', () => { if (this.state === 'editor') { Editor.ghost.visible = false; $('#cursorInfo').classList.add('hidden'); } });
    cv.addEventListener('wheel', e => { e.preventDefault(); if (this.state === 'editor' || (this.state === 'ride' && Ride.cams[Ride.cam] === 'orbit')) Cam.zoom(Math.pow(1.0015, e.deltaY * (Settings.d.camSens || 1))); }, { passive: false });
    window.addEventListener('keydown', e => {
      const tag = (e.target.tagName || '').toLowerCase();
      if ((tag === 'input' || tag === 'textarea' || tag === 'select') && e.key !== 'Escape') return;
      const k = e.key.toLowerCase();
      if (Modal.isOpen) { if (k === 'escape') Modal.close(); return; }
      if (!$('#pause').classList.contains('hidden')) { if (k === 'escape') this.pause(false); return; }
      if (k === 'escape' && this.state === 'editor' && !Builder.active && !Editor.sel.length && !Editor.drag) { this.pause(true); e.preventDefault(); return; }
      const builderKeys = this.state === 'editor' && Builder.active ? ['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'r'] : [];
      if (['w', 'a', 's', 'd', 'q', 'e', 'r', 'f', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'shift'].includes(k) && !builderKeys.includes(k) && !e.ctrlKey && !e.metaKey) Cam.keys[k] = true;
      if (this.state === 'ride') {
        if (k === 'escape') { document.body.classList.remove('photo'); Ride.stop(); } else if (k === 'c') Ride.cycleCam(); else if (k === '[') Ride.cycleSpeed(-1); else if (k === ']') Ride.cycleSpeed(1);
        else if (k === 'u') Units.toggle(); else if (k === ' ') Ride.restart(); else return;
        e.preventDefault(); return;
      }
      if (k === 'p' && (this.state === 'editor' || this.state === 'ride')) { const h = document.body.classList.toggle('photo'); toast(h ? 'Photo mode: press P to show the interface' : 'Interface restored'); e.preventDefault(); return; }
      if (this.state === 'editor') { if (Editor.onKey(e, true)) e.preventDefault(); }
      else if (this.state === 'menu' && k === 'escape') Modal.close();
    });
    window.addEventListener('keyup', e => { Cam.keys[e.key.toLowerCase()] = false; if (e.key === 'Shift') Cam.keys.shift = false; });
    window.addEventListener('blur', () => { Cam.keys = {}; });
  },
  // first launch only: if the default graphics level runs below ~28 fps, step it down once or twice
  autoTune(dt) {
    if (Settings.d.gfxTuned || navigator.webdriver) return;
    const a = this._at || (this._at = { t: 0, n: 0, warm: 0 });
    a.warm += dt; if (a.warm < 3) return;
    a.t += dt; a.n++;
    if (a.t < 4) return;
    const fps = a.n / a.t; this._at = null;
    if (fps < 28 && Gfx.lv() > 1) { Settings.d.gfx = Gfx.lv() - 1; Settings.save(); applyGraphics(); toast('Graphics set to ' + Gfx.name() + ' for smoother play (change it in Settings)'); this._tunes = (this._tunes || 0) + 1; if (this._tunes >= 2) { Settings.d.gfxTuned = true; Settings.save(); } }
    else { Settings.d.gfxTuned = true; Settings.save(); }
  },
  pause(on) {
    const p = $('#pause');
    if (on === undefined) on = p.classList.contains('hidden');
    if (!on) { p.classList.add('hidden'); Sound.ui('close'); return; }
    const nav = $('#pauseNav'); nav.innerHTML = '';
    const item = (n, label, fn) => el('button', { class: 'mnav', style: `animation-delay:${n * 0.04}s`, onclick: () => { p.classList.add('hidden'); fn(); } }, el('span', { class: 'num' }, String(n).padStart(2, '0')), el('span', null, label));
    nav.append(item(1, 'Resume', () => { }), item(2, 'Test Ride', () => Ride.start()), item(3, 'Save', () => this.saveDialog()), item(4, 'Settings', () => this.settingsDialog()), item(5, 'Main Menu', () => this.toMenu()));
    p.classList.remove('hidden'); Sound.ui('open');
  },
  renderFrame() { Mirror.update(R.camera, performance.now()); Post.render(R.scene, R.camera); },
  loop(t) {
    requestAnimationFrame(tt => this.loop(tt));
    const raw = Math.min(0.1, Math.max(0, (t - this.last) / 1000)); this.last = t;
    // smooth frame pacing hiccups so motion never stutters (a spike is spread over a few frames)
    this.sdt = this.sdt == null ? raw : lerp(this.sdt, raw, raw > this.sdt * 2.5 ? 0.25 : 0.5);
    const dt = this.sdt;
    let focus = null;
    try {
      if (this.state === 'menu') focus = Attract.update(dt);
      else if (this.state === 'editor') { Cam.update(dt); Editor.update(dt); Cam.apply(R.camera); focus = Cam.target; }
      else if (this.state === 'ride') focus = Ride.update(dt);
    } catch (err) { console.error(err); }
    if (Editor.design && Editor.design.rainbow && Train.group.visible === false) { /* idle */ }
    Env.update(dt, R.camera, focus);
    Terrain.tick(dt, t); Wind.u.value = t / 1000; TrackFX.update(dt, t); Birds.update(t / 1000);
    this.renderFrame();
    this.frames++; this.fpsT += dt;
    this.autoTune(dt);
    if (this.fpsT > 0.5) { if (Settings.d.showFps) $('#fps').textContent = Math.round(this.frames / this.fpsT) + ' fps · ' + R.renderer.info.render.calls + ' draws'; this.frames = 0; this.fpsT = 0; }
  }
};
